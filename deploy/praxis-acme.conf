# HTTP validation for the API's combined DNS/IP certificate.
# Keep the existing frostraven05.com website and the HTTPS API running.
server {
    listen 80;
    listen [::]:80;
    server_name todo.frostraven05.com 8.152.219.210;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
